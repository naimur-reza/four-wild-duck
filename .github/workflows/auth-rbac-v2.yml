name: Auth RBAC v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auth-rbac:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add auth files
        shell: bash
        run: |
          mkdir -p src/app/auth/callback src/app/login src/app/onboarding src/app/setup-mess src/app/actions src/lib/auth src/lib/supabase supabase/migrations

          cat > src/lib/supabase/client.ts <<'EOF'
          import { createBrowserClient } from "@supabase/ssr";

          export function createClient() {
            return createBrowserClient(
              process.env.NEXT_PUBLIC_SUPABASE_URL!,
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!
            );
          }
          EOF

          cat > src/lib/supabase/server.ts <<'EOF'
          import { createServerClient } from "@supabase/ssr";
          import { cookies } from "next/headers";

          export async function createClient() {
            const cookieStore = await cookies();

            return createServerClient(
              process.env.NEXT_PUBLIC_SUPABASE_URL!,
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!,
              {
                cookies: {
                  getAll() {
                    return cookieStore.getAll();
                  },
                  setAll(cookiesToSet) {
                    try {
                      cookiesToSet.forEach(({ name, value, options }) => cookieStore.set(name, value, options));
                    } catch {}
                  }
                }
              }
            );
          }
          EOF

          cat > src/lib/supabase/middleware.ts <<'EOF'
          import { createServerClient } from "@supabase/ssr";
          import { NextResponse, type NextRequest } from "next/server";

          const protectedRoutes = ["/dashboard", "/members", "/expenses", "/payments", "/reports", "/history", "/settings", "/setup-mess", "/onboarding"];
          const authRoutes = ["/login"];

          export async function updateSession(request: NextRequest) {
            let response = NextResponse.next({ request });

            const supabase = createServerClient(
              process.env.NEXT_PUBLIC_SUPABASE_URL!,
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!,
              {
                cookies: {
                  getAll() {
                    return request.cookies.getAll();
                  },
                  setAll(cookiesToSet) {
                    cookiesToSet.forEach(({ name, value }) => request.cookies.set(name, value));
                    response = NextResponse.next({ request });
                    cookiesToSet.forEach(({ name, value, options }) => response.cookies.set(name, value, options));
                  }
                }
              }
            );

            const { data: { user } } = await supabase.auth.getUser();
            const pathname = request.nextUrl.pathname;
            const isProtected = protectedRoutes.some((route) => pathname === route || pathname.startsWith(`${route}/`));
            const isAuthRoute = authRoutes.some((route) => pathname === route || pathname.startsWith(`${route}/`));

            if (isProtected && !user) {
              const url = request.nextUrl.clone();
              url.pathname = "/login";
              url.searchParams.set("next", pathname);
              return NextResponse.redirect(url);
            }

            if (isAuthRoute && user) {
              const url = request.nextUrl.clone();
              url.pathname = "/onboarding";
              url.search = "";
              return NextResponse.redirect(url);
            }

            return response;
          }
          EOF

          cat > middleware.ts <<'EOF'
          import type { NextRequest } from "next/server";
          import { updateSession } from "@/lib/supabase/middleware";

          export async function middleware(request: NextRequest) {
            return updateSession(request);
          }

          export const config = {
            matcher: ["/((?!_next/static|_next/image|favicon.ico|.*\\.(?:svg|png|jpg|jpeg|gif|webp)$).*)"]
          };
          EOF

          cat > src/lib/auth/ensure-profile.ts <<'EOF'
          import { redirect } from "next/navigation";
          import { createClient } from "@/lib/supabase/server";

          export async function getCurrentUser() {
            const supabase = await createClient();
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) redirect("/login");
            return user;
          }

          export async function ensureProfile() {
            const supabase = await createClient();
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) redirect("/login");

            const fullName = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split("@")[0] || "Member";
            const avatarUrl = user.user_metadata?.avatar_url || user.user_metadata?.picture || null;
            const username = user.email?.split("@")[0]?.toLowerCase().replace(/[^a-z0-9_\-]/g, "-") || null;

            await supabase.from("profiles").upsert({ user_id: user.id, name: fullName, username, avatar_url: avatarUrl, email: user.email }, { onConflict: "user_id" });
            return user;
          }
          EOF

          cat > src/lib/auth/mess.ts <<'EOF'
          import { createClient } from "@/lib/supabase/server";

          export type MessRole = "OWNER" | "MANAGER" | "MEMBER";

          export async function getActiveMembership(userId: string) {
            const supabase = await createClient();
            const { data, error } = await supabase
              .from("mess_members")
              .select("id, mess_id, user_id, role, opening_balance, status, messes(id, name)")
              .eq("user_id", userId)
              .eq("status", "active")
              .order("created_at", { ascending: true })
              .limit(1)
              .maybeSingle();
            if (error) return null;
            return data;
          }

          export function canManageMembers(role?: MessRole | null) { return role === "OWNER" || role === "MANAGER"; }
          export function canCloseMonth(role?: MessRole | null) { return role === "OWNER" || role === "MANAGER"; }
          export function canChangeRoles(role?: MessRole | null) { return role === "OWNER"; }
          EOF

          cat > src/app/login/page.tsx <<'EOF'
          import { Suspense } from "react";
          import { LoginCard } from "./login-card";

          export default function LoginPage() {
            return <main className="flex min-h-screen items-center justify-center px-4 py-10 text-slate-950"><Suspense fallback={null}><LoginCard /></Suspense></main>;
          }
          EOF

          cat > src/app/login/login-card.tsx <<'EOF'
          "use client";

          import { useSearchParams } from "next/navigation";
          import { createClient } from "@/lib/supabase/client";

          export function LoginCard() {
            const searchParams = useSearchParams();
            const next = searchParams.get("next") || "/onboarding";

            async function handleGoogleLogin() {
              const supabase = createClient();
              const origin = window.location.origin;
              await supabase.auth.signInWithOAuth({ provider: "google", options: { redirectTo: `${origin}/auth/callback?next=${encodeURIComponent(next)}` } });
            }

            return (
              <section className="w-full max-w-md rounded-[2rem] border border-white bg-white/85 p-6 shadow-2xl shadow-slate-200/70 backdrop-blur md:p-8">
                <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-gradient-to-br from-slate-950 to-slate-800 text-2xl font-black text-teal-300">M</div>
                <div className="mt-6 text-center"><p className="text-xs font-black uppercase tracking-[0.24em] text-teal-600">Mess Khata</p><h1 className="mt-2 text-3xl font-black">Welcome back</h1></div>
                <button onClick={handleGoogleLogin} className="mt-8 flex w-full items-center justify-center gap-3 rounded-2xl bg-slate-950 px-5 py-4 text-sm font-black text-white shadow-xl shadow-slate-200 transition hover:-translate-y-0.5 hover:bg-teal-600"><span className="rounded-full bg-white px-2 py-1 text-xs font-black text-slate-950">G</span>Continue with Google</button>
              </section>
            );
          }
          EOF

          cat > src/app/auth/callback/route.ts <<'EOF'
          import { NextResponse } from "next/server";
          import { createClient } from "@/lib/supabase/server";

          export async function GET(request: Request) {
            const requestUrl = new URL(request.url);
            const code = requestUrl.searchParams.get("code");
            const next = requestUrl.searchParams.get("next") || "/onboarding";
            if (code) {
              const supabase = await createClient();
              await supabase.auth.exchangeCodeForSession(code);
            }
            return NextResponse.redirect(new URL(next, requestUrl.origin));
          }
          EOF

          cat > src/app/actions/auth.ts <<'EOF'
          "use server";

          import { redirect } from "next/navigation";
          import { createClient } from "@/lib/supabase/server";

          export async function signOut() {
            const supabase = await createClient();
            await supabase.auth.signOut();
            redirect("/login");
          }
          EOF

          cat > src/app/onboarding/page.tsx <<'EOF'
          import { redirect } from "next/navigation";
          import { ensureProfile } from "@/lib/auth/ensure-profile";
          import { getActiveMembership } from "@/lib/auth/mess";

          export default async function OnboardingPage() {
            const user = await ensureProfile();
            const membership = await getActiveMembership(user.id);
            if (membership) redirect("/dashboard");
            redirect("/setup-mess");
          }
          EOF

          cat > src/app/setup-mess/actions.ts <<'EOF'
          "use server";

          import { redirect } from "next/navigation";
          import { ensureProfile } from "@/lib/auth/ensure-profile";
          import { createClient } from "@/lib/supabase/server";

          export async function createMess(formData: FormData) {
            const user = await ensureProfile();
            const supabase = await createClient();
            const name = String(formData.get("name") || "").trim();
            const openingBalance = Number(formData.get("opening_balance") || 0);
            if (!name) return;

            const { data: mess, error: messError } = await supabase.from("messes").insert({ name, created_by: user.id }).select("id").single();
            if (messError || !mess) throw new Error(messError?.message || "Could not create mess");

            const { error: memberError } = await supabase.from("mess_members").insert({ mess_id: mess.id, user_id: user.id, role: "OWNER", opening_balance: openingBalance, status: "active" });
            if (memberError) throw new Error(memberError.message);
            redirect("/dashboard");
          }
          EOF

          cat > src/app/setup-mess/page.tsx <<'EOF'
          import { redirect } from "next/navigation";
          import { createMess } from "./actions";
          import { ensureProfile } from "@/lib/auth/ensure-profile";
          import { getActiveMembership } from "@/lib/auth/mess";

          export default async function SetupMessPage() {
            const user = await ensureProfile();
            const membership = await getActiveMembership(user.id);
            if (membership) redirect("/dashboard");

            return (
              <main className="flex min-h-screen items-center justify-center px-4 py-10 text-slate-950">
                <section className="w-full max-w-lg rounded-[2rem] border border-white bg-white/85 p-6 shadow-2xl shadow-slate-200/70 backdrop-blur md:p-8">
                  <p className="text-xs font-black uppercase tracking-[0.24em] text-teal-600">Setup</p>
                  <h1 className="mt-2 text-3xl font-black">Create your mess</h1>
                  <form action={createMess} className="mt-8 space-y-4">
                    <div><label className="text-xs font-black uppercase tracking-[0.18em] text-slate-400">Mess name</label><input name="name" defaultValue="Four Wild Duck" className="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold outline-none transition focus:border-teal-400 focus:bg-white" required /></div>
                    <div><label className="text-xs font-black uppercase tracking-[0.18em] text-slate-400">Your opening balance</label><input name="opening_balance" type="number" defaultValue="0" className="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold outline-none transition focus:border-teal-400 focus:bg-white" /><p className="mt-2 text-xs font-medium text-slate-400">Positive = due, negative = advance.</p></div>
                    <button className="w-full rounded-2xl bg-slate-950 px-5 py-4 text-sm font-black text-white shadow-xl shadow-slate-200 transition hover:-translate-y-0.5 hover:bg-teal-600">Create mess</button>
                  </form>
                </section>
              </main>
            );
          }
          EOF

          cat > supabase/migrations/002_auth_roles_rls.sql <<'EOF'
          do $$ begin
            create type public.mess_role as enum ('OWNER', 'MANAGER', 'MEMBER');
          exception when duplicate_object then null;
          end $$;

          create table if not exists public.profiles (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null unique references auth.users(id) on delete cascade,
            name text not null,
            username text unique,
            avatar_url text,
            email text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table if not exists public.messes (
            id uuid primary key default gen_random_uuid(),
            name text not null,
            created_by uuid not null references auth.users(id) on delete cascade,
            created_at timestamptz not null default now()
          );

          alter table if exists public.mess_members
            add column if not exists user_id uuid references auth.users(id) on delete cascade,
            add column if not exists role public.mess_role not null default 'MEMBER',
            add column if not exists mess_id uuid references public.messes(id) on delete cascade,
            add column if not exists opening_balance numeric(12, 2) not null default 0,
            add column if not exists status text not null default 'active';

          create unique index if not exists mess_members_mess_user_unique on public.mess_members(mess_id, user_id);

          alter table public.profiles enable row level security;
          alter table public.messes enable row level security;
          alter table public.mess_members enable row level security;
          alter table public.months enable row level security;
          alter table public.expenses enable row level security;
          alter table public.cash_payments enable row level security;
          alter table public.monthly_summaries enable row level security;

          create or replace function public.is_mess_member(target_mess_id uuid)
          returns boolean language sql stable security definer set search_path = public as $$
            select exists (select 1 from public.mess_members where mess_id = target_mess_id and user_id = auth.uid() and status = 'active');
          $$;

          create or replace function public.has_mess_role(target_mess_id uuid, allowed_roles public.mess_role[])
          returns boolean language sql stable security definer set search_path = public as $$
            select exists (select 1 from public.mess_members where mess_id = target_mess_id and user_id = auth.uid() and role = any(allowed_roles) and status = 'active');
          $$;

          drop policy if exists "Profiles select own" on public.profiles;
          create policy "Profiles select own" on public.profiles for select to authenticated using (user_id = auth.uid());
          drop policy if exists "Profiles insert own" on public.profiles;
          create policy "Profiles insert own" on public.profiles for insert to authenticated with check (user_id = auth.uid());
          drop policy if exists "Profiles update own" on public.profiles;
          create policy "Profiles update own" on public.profiles for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());

          drop policy if exists "Messes select members" on public.messes;
          create policy "Messes select members" on public.messes for select to authenticated using (public.is_mess_member(id) or created_by = auth.uid());
          drop policy if exists "Messes insert creator" on public.messes;
          create policy "Messes insert creator" on public.messes for insert to authenticated with check (created_by = auth.uid());
          drop policy if exists "Messes update owners" on public.messes;
          create policy "Messes update owners" on public.messes for update to authenticated using (public.has_mess_role(id, array['OWNER']::public.mess_role[]));

          drop policy if exists "Membership select members" on public.mess_members;
          create policy "Membership select members" on public.mess_members for select to authenticated using (public.is_mess_member(mess_id) or user_id = auth.uid());
          drop policy if exists "Membership insert self" on public.mess_members;
          create policy "Membership insert self" on public.mess_members for insert to authenticated with check (user_id = auth.uid());
          drop policy if exists "Membership update managers" on public.mess_members;
          create policy "Membership update managers" on public.mess_members for update to authenticated using (public.has_mess_role(mess_id, array['OWNER','MANAGER']::public.mess_role[]));
          EOF

          rm -f .github/workflows/auth-rbac-v2.yml
          rm -f .github/workflows/auth-rbac.yml
          rm -f .github/workflows/member-create-ui.yml
          rm -f .github/workflows/polish-ui.yml
          rm -f .github/workflows/redesign-dashboard.yml
          rm -f .github/workflows/bootstrap-mess-khata.yml
          rm -f Test

      - name: Commit and push auth implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add google auth protected routes and mess roles" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
