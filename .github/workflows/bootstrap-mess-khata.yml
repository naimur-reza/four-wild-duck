name: Bootstrap Mess Khata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scaffold app
        shell: bash
        run: |
          rm -rf /tmp/mess-khata
          npx create-next-app@latest /tmp/mess-khata --ts --tailwind --eslint --app --src-dir --import-alias "@/*" --use-npm --yes
          cp -a /tmp/mess-khata/. .
          npm install @supabase/ssr @supabase/supabase-js clsx lucide-react tailwind-merge

      - name: Add Mess Khata MVP files
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Mess Khata

          A mobile-first shared mess expense tracker for family-style messes where everyone spends freely and the monthly total is split equally.

          ## Core formula

          ```txt
          Closing Balance = Previous Balance + Monthly Share - Total Contribution
          Monthly Share = Total Shared Expense / Active Members
          Total Contribution = Expenses Paid By Member + Cash Payments
          ```

          Positive balance means due. Negative balance means advance.

          ## Stack

          - Next.js App Router
          - TypeScript
          - Tailwind CSS
          - Supabase PostgreSQL
          - Supabase Auth-ready structure

          ## Setup

          ```bash
          npm install
          cp .env.example .env.local
          npm run dev
          ```

          ## Database

          Run the SQL inside `supabase/migrations/001_initial_schema.sql` in your Supabase SQL editor.
          EOF

          cat > .env.example <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=
          NEXT_PUBLIC_SUPABASE_ANON_KEY=
          EOF

          mkdir -p src/types src/features/ledger src/lib/data src/lib/supabase src/components supabase/migrations

          cat > src/types/ledger.ts <<'EOF'
          export type MemberStatus = "active" | "inactive";

          export type Member = {
            id: string;
            name: string;
            phone?: string;
            status: MemberStatus;
            openingBalance: number;
          };

          export type ExpenseCategory = "rent" | "bazar" | "electricity" | "gas" | "internet" | "other";

          export type Expense = {
            id: string;
            memberId: string;
            category: ExpenseCategory;
            amount: number;
            date: string;
            note?: string;
          };

          export type CashPayment = {
            id: string;
            memberId: string;
            amount: number;
            date: string;
            note?: string;
          };

          export type MemberMonthlySummary = {
            member: Member;
            previousBalance: number;
            monthlyShare: number;
            expensePaid: number;
            cashPaid: number;
            totalContribution: number;
            closingBalance: number;
          };
          EOF

          cat > src/features/ledger/calculate-ledger.ts <<'EOF'
          import type { CashPayment, Expense, Member, MemberMonthlySummary } from "@/types/ledger";

          export function calculateMonthlySummary({
            members,
            expenses,
            cashPayments,
            previousBalances
          }: {
            members: Member[];
            expenses: Expense[];
            cashPayments: CashPayment[];
            previousBalances?: Record<string, number>;
          }) {
            const activeMembers = members.filter((member) => member.status === "active");
            const totalExpense = expenses.reduce((sum, expense) => sum + expense.amount, 0);
            const monthlyShare = activeMembers.length > 0 ? totalExpense / activeMembers.length : 0;

            const summaries: MemberMonthlySummary[] = activeMembers.map((member) => {
              const expensePaid = expenses
                .filter((expense) => expense.memberId === member.id)
                .reduce((sum, expense) => sum + expense.amount, 0);

              const cashPaid = cashPayments
                .filter((payment) => payment.memberId === member.id)
                .reduce((sum, payment) => sum + payment.amount, 0);

              const previousBalance = previousBalances?.[member.id] ?? member.openingBalance;
              const totalContribution = expensePaid + cashPaid;
              const closingBalance = previousBalance + monthlyShare - totalContribution;

              return { member, previousBalance, monthlyShare, expensePaid, cashPaid, totalContribution, closingBalance };
            });

            return { totalExpense, memberCount: activeMembers.length, monthlyShare, summaries };
          }
          EOF

          cat > src/lib/data/demo-ledger.ts <<'EOF'
          import { calculateMonthlySummary } from "@/features/ledger/calculate-ledger";
          import type { CashPayment, Expense, Member } from "@/types/ledger";

          export const demoMembers: Member[] = [
            { id: "naimur", name: "Naimur", phone: "017xxxxxxxx", status: "active", openingBalance: 3000 },
            { id: "rahim", name: "Rahim", status: "active", openingBalance: 0 },
            { id: "karim", name: "Karim", status: "active", openingBalance: 1000 },
            { id: "hasan", name: "Hasan", status: "active", openingBalance: 0 }
          ];

          export const demoExpenses: Expense[] = [
            { id: "e1", memberId: "rahim", category: "rent", amount: 4800, date: "2026-05-01", note: "House rent" },
            { id: "e2", memberId: "naimur", category: "bazar", amount: 2000, date: "2026-05-04", note: "Bazar" },
            { id: "e3", memberId: "rahim", category: "bazar", amount: 5000, date: "2026-05-10", note: "Weekly bazar" },
            { id: "e4", memberId: "hasan", category: "electricity", amount: 900, date: "2026-05-18", note: "Electricity bill" },
            { id: "e5", memberId: "hasan", category: "internet", amount: 1000, date: "2026-05-20", note: "Internet" }
          ];

          export const demoCashPayments: CashPayment[] = [
            { id: "p1", memberId: "naimur", amount: 4000, date: "2026-05-05", note: "Extra due payment" },
            { id: "p2", memberId: "karim", amount: 3000, date: "2026-05-07", note: "Cash payment" },
            { id: "p3", memberId: "hasan", amount: 4000, date: "2026-05-08", note: "Cash payment" }
          ];

          export const demoLedger = calculateMonthlySummary({ members: demoMembers, expenses: demoExpenses, cashPayments: demoCashPayments });
          EOF

          cat > src/lib/utils.ts <<'EOF'
          export function formatTaka(amount: number) {
            return new Intl.NumberFormat("en-BD", {
              style: "currency",
              currency: "BDT",
              maximumFractionDigits: 0
            }).format(amount);
          }
          EOF

          cat > src/components/stat-card.tsx <<'EOF'
          export function StatCard({ label, value, helper }: { label: string; value: string; helper?: string }) {
            return (
              <div className="rounded-3xl border bg-white p-5 shadow-sm">
                <p className="text-sm text-slate-500">{label}</p>
                <p className="mt-2 text-2xl font-semibold text-slate-950">{value}</p>
                {helper ? <p className="mt-1 text-xs text-slate-500">{helper}</p> : null}
              </div>
            );
          }
          EOF

          cat > src/lib/supabase/client.ts <<'EOF'
          import { createBrowserClient } from "@supabase/ssr";

          export function createClient() {
            return createBrowserClient(
              process.env.NEXT_PUBLIC_SUPABASE_URL!,
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!
            );
          }
          EOF

          cat > src/app/page.tsx <<'EOF'
          import Link from "next/link";
          import { demoLedger } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";
          import { StatCard } from "@/components/stat-card";

          export default function Home() {
            return (
              <main className="min-h-screen bg-slate-50 px-4 py-6 text-slate-950 sm:px-8">
                <section className="mx-auto max-w-6xl space-y-8">
                  <div className="rounded-[2rem] bg-slate-950 p-6 text-white shadow-xl sm:p-10">
                    <p className="text-sm font-medium text-emerald-300">Mess Khata MVP</p>
                    <h1 className="mt-4 max-w-3xl text-4xl font-bold tracking-tight sm:text-6xl">
                      Shared expense, monthly split, and due history tracker.
                    </h1>
                    <p className="mt-4 max-w-2xl text-slate-300">
                      No meal system. Everyone spends like family, the app divides total monthly cost by active members and carries due to the next month.
                    </p>
                    <Link href="/reports" className="mt-8 inline-flex rounded-full bg-white px-5 py-3 font-semibold text-slate-950">
                      View monthly report
                    </Link>
                  </div>

                  <div className="grid gap-4 sm:grid-cols-3">
                    <StatCard label="Total expense" value={formatTaka(demoLedger.totalExpense)} helper="Rent + bazar + bills" />
                    <StatCard label="Active members" value={String(demoLedger.memberCount)} helper="Split equally" />
                    <StatCard label="Per person share" value={formatTaka(demoLedger.monthlyShare)} helper="Auto calculated" />
                  </div>

                  <div className="rounded-3xl border bg-white p-5 shadow-sm">
                    <h2 className="text-xl font-semibold">Live due preview</h2>
                    <div className="mt-4 overflow-x-auto">
                      <table className="w-full min-w-[760px] text-left text-sm">
                        <thead className="text-slate-500">
                          <tr><th className="py-3">Member</th><th>Previous</th><th>Share</th><th>Spent</th><th>Cash</th><th>Closing</th></tr>
                        </thead>
                        <tbody>
                          {demoLedger.summaries.map((row) => (
                            <tr key={row.member.id} className="border-t">
                              <td className="py-4 font-medium">{row.member.name}</td>
                              <td>{formatTaka(row.previousBalance)}</td>
                              <td>{formatTaka(row.monthlyShare)}</td>
                              <td>{formatTaka(row.expensePaid)}</td>
                              <td>{formatTaka(row.cashPaid)}</td>
                              <td className={row.closingBalance > 0 ? "font-semibold text-red-600" : "font-semibold text-emerald-600"}>
                                {row.closingBalance > 0 ? "Due " : "Advance "}{formatTaka(Math.abs(row.closingBalance))}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>
              </main>
            );
          }
          EOF

          mkdir -p src/app/reports src/app/members src/app/expenses src/app/payments src/app/history
          cat > src/app/reports/page.tsx <<'EOF'
          export { default } from "../page";
          EOF

          cat > supabase/migrations/001_initial_schema.sql <<'EOF'
          create extension if not exists "pgcrypto";

          create table public.members (
            id uuid primary key default gen_random_uuid(),
            name text not null,
            phone text,
            status text not null default 'active' check (status in ('active', 'inactive')),
            opening_balance numeric(12, 2) not null default 0,
            created_at timestamptz not null default now()
          );

          create table public.months (
            id uuid primary key default gen_random_uuid(),
            label text not null,
            member_count int not null default 4,
            status text not null default 'open' check (status in ('open', 'closed')),
            created_at timestamptz not null default now(),
            closed_at timestamptz
          );

          create table public.expenses (
            id uuid primary key default gen_random_uuid(),
            month_id uuid references public.months(id) on delete cascade,
            member_id uuid references public.members(id) on delete set null,
            category text not null,
            amount numeric(12, 2) not null check (amount >= 0),
            expense_date date not null,
            note text,
            created_at timestamptz not null default now()
          );

          create table public.cash_payments (
            id uuid primary key default gen_random_uuid(),
            month_id uuid references public.months(id) on delete cascade,
            member_id uuid references public.members(id) on delete cascade,
            amount numeric(12, 2) not null check (amount >= 0),
            payment_date date not null,
            note text,
            created_at timestamptz not null default now()
          );

          create table public.monthly_summaries (
            id uuid primary key default gen_random_uuid(),
            month_id uuid references public.months(id) on delete cascade,
            member_id uuid references public.members(id) on delete cascade,
            previous_balance numeric(12, 2) not null default 0,
            monthly_share numeric(12, 2) not null default 0,
            expense_paid numeric(12, 2) not null default 0,
            cash_paid numeric(12, 2) not null default 0,
            total_contribution numeric(12, 2) not null default 0,
            closing_balance numeric(12, 2) not null default 0,
            created_at timestamptz not null default now(),
            unique(month_id, member_id)
          );
          EOF

          rm -f Test
          rm -f .github/workflows/bootstrap-mess-khata.yml

      - name: Commit generated app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: bootstrap mess khata starter" || echo "No changes to commit"
          git push
