name: Compact Mobile UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compact mobile layout
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/components/layout/app-shell.tsx')
          s = p.read_text()
          s = s.replace('bg-[#f7fbfa]/[0.78] px-4 py-4 shadow-sm shadow-slate-200/40 backdrop-blur-2xl md:px-8', 'bg-[#f7fbfa]/[0.82] px-3 py-3 shadow-sm shadow-slate-200/30 backdrop-blur-2xl sm:px-4 sm:py-4 md:px-8')
          s = s.replace('justify-between gap-4', 'justify-between gap-3')
          s = s.replace('text-[11px] font-black uppercase tracking-[0.2em] text-teal-700', 'text-[9px] font-black uppercase tracking-[0.18em] text-teal-700')
          s = s.replace('truncate text-lg font-black', 'truncate text-base font-black')
          s = s.replace('px-4 py-2 text-xs', 'px-3 py-2 text-[10px] sm:px-4 sm:text-xs')
          s = s.replace('px-4 py-7 pb-28 md:px-8 md:pb-12', 'px-3 py-4 pb-24 sm:px-4 sm:py-7 sm:pb-28 md:px-8 md:pb-12')
          p.write_text(s)

          p = Path('src/components/layout/bottom-nav.tsx')
          s = p.read_text()
          s = s.replace('px-2 pb-2 pt-2', 'px-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1.5')
          s = s.replace('rounded-2xl px-2 py-2 text-[10px]', 'rounded-xl px-1.5 py-1.5 text-[9px]')
          s = s.replace('mb-1 h-4 w-4', 'mb-0.5 h-4 w-4')
          p.write_text(s)

          p = Path('src/app/globals.css')
          s = p.read_text()
          if '@media (max-width: 640px)' not in s:
              s += '''

@media (max-width: 640px) {
  input, select, textarea {
    min-height: 2.75rem;
  }

  button, a {
    touch-action: manipulation;
  }
}
'''
          p.write_text(s)

          wf = Path('.github/workflows/compact-mobile-ui.yml')
          wf.unlink(missing_ok=True)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: compact mobile app layout" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
