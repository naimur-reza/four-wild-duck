name: Polish UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply modern dashboard UI
        shell: bash
        run: |
          mkdir -p src/app/dashboard src/app/members src/app/expenses src/app/payments src/app/reports src/app/history src/app/settings
          mkdir -p src/components/layout src/components/ui src/lib/constants

          cat > src/app/globals.css <<'EOF'
          @import "tailwindcss";

          :root {
            --background: #f6f7fb;
            --foreground: #101828;
          }

          * { box-sizing: border-box; }

          html { scroll-behavior: smooth; }

          body {
            margin: 0;
            min-height: 100vh;
            background:
              radial-gradient(circle at 0% 0%, rgba(20, 184, 166, 0.16), transparent 28rem),
              radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.12), transparent 26rem),
              #f6f7fb;
            color: var(--foreground);
            font-family: var(--font-plus-jakarta), var(--font-geist-sans), Arial, sans-serif;
          }

          button, input, select, textarea { font: inherit; }

          ::selection {
            background: #0f172a;
            color: white;
          }
          EOF

          cat > src/app/layout.tsx <<'EOF'
          import type { Metadata } from "next";
          import { Geist, Geist_Mono, Plus_Jakarta_Sans } from "next/font/google";
          import "./globals.css";

          const geistSans = Geist({ variable: "--font-geist-sans", subsets: ["latin"] });
          const geistMono = Geist_Mono({ variable: "--font-geist-mono", subsets: ["latin"] });
          const plusJakarta = Plus_Jakarta_Sans({ variable: "--font-plus-jakarta", subsets: ["latin"] });

          export const metadata: Metadata = {
            title: "Mess Khata",
            description: "Shared mess expense tracker"
          };

          export default function RootLayout({ children }: Readonly<{ children: React.ReactNode }>) {
            return (
              <html lang="en">
                <body className={`${geistSans.variable} ${geistMono.variable} ${plusJakarta.variable} antialiased`}>
                  {children}
                </body>
              </html>
            );
          }
          EOF

          cat > src/lib/constants/navigation.ts <<'EOF'
          import { BarChart3, Clock3, CreditCard, Grid2X2, ReceiptText, Settings, UsersRound } from "lucide-react";

          export const dashboardNavItems = [
            { label: "Home", href: "/dashboard", icon: Grid2X2 },
            { label: "Members", href: "/members", icon: UsersRound },
            { label: "Expenses", href: "/expenses", icon: ReceiptText },
            { label: "Payments", href: "/payments", icon: CreditCard },
            { label: "Reports", href: "/reports", icon: BarChart3 },
            { label: "History", href: "/history", icon: Clock3 },
            { label: "Settings", href: "/settings", icon: Settings }
          ];
          EOF

          cat > src/components/layout/sidebar-nav.tsx <<'EOF'
          "use client";

          import Link from "next/link";
          import { usePathname } from "next/navigation";
          import { dashboardNavItems } from "@/lib/constants/navigation";

          export function SidebarNav() {
            const pathname = usePathname();

            return (
              <div className="mt-8 space-y-1.5">
                {dashboardNavItems.map((item) => {
                  const Icon = item.icon;
                  const active = pathname === item.href || (item.href !== "/dashboard" && pathname.startsWith(item.href));

                  return (
                    <Link
                      key={item.href}
                      href={item.href}
                      className={`group flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold transition ${
                        active
                          ? "bg-slate-950 text-white shadow-lg shadow-slate-200"
                          : "text-slate-500 hover:bg-white hover:text-slate-950 hover:shadow-sm"
                      }`}
                    >
                      <span className={`flex h-9 w-9 items-center justify-center rounded-xl transition ${active ? "bg-teal-400 text-slate-950" : "bg-slate-100 text-slate-500 group-hover:bg-teal-50 group-hover:text-teal-700"}`}>
                        <Icon className="h-4 w-4" />
                      </span>
                      {item.label}
                    </Link>
                  );
                })}
              </div>
            );
          }
          EOF

          cat > src/components/layout/bottom-nav.tsx <<'EOF'
          "use client";

          import Link from "next/link";
          import { usePathname } from "next/navigation";
          import { dashboardNavItems } from "@/lib/constants/navigation";

          export function BottomNav() {
            const pathname = usePathname();
            const items = dashboardNavItems.slice(0, 5);

            return (
              <nav className="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200/70 bg-white/90 px-2 pb-2 pt-2 shadow-[0_-18px_40px_rgba(15,23,42,0.10)] backdrop-blur-2xl md:hidden">
                <div className="mx-auto grid max-w-md grid-cols-5 gap-1">
                  {items.map((item) => {
                    const Icon = item.icon;
                    const active = pathname === item.href || (item.href !== "/dashboard" && pathname.startsWith(item.href));

                    return (
                      <Link
                        key={item.href}
                        href={item.href}
                        className={`flex flex-col items-center justify-center rounded-2xl px-2 py-2 text-[10px] font-bold transition ${
                          active ? "bg-slate-950 text-white" : "text-slate-400 hover:bg-slate-100 hover:text-slate-950"
                        }`}
                      >
                        <Icon className={`mb-1 h-4 w-4 ${active ? "text-teal-300" : ""}`} />
                        {item.label}
                      </Link>
                    );
                  })}
                </div>
              </nav>
            );
          }
          EOF

          cat > src/components/layout/app-shell.tsx <<'EOF'
          import Link from "next/link";
          import { BottomNav } from "@/components/layout/bottom-nav";
          import { SidebarNav } from "@/components/layout/sidebar-nav";

          export function AppShell({ children }: { children: React.ReactNode }) {
            return (
              <div className="min-h-screen text-slate-950">
                <aside className="fixed inset-y-0 left-0 hidden w-72 border-r border-white/70 bg-white/70 p-5 shadow-[20px_0_60px_rgba(15,23,42,0.04)] backdrop-blur-2xl md:block">
                  <Link href="/dashboard" className="flex items-center gap-3 rounded-[1.75rem] bg-gradient-to-br from-slate-950 to-slate-800 p-4 text-white shadow-xl shadow-slate-200">
                    <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-300 to-lime-300 text-lg font-black text-slate-950">M</div>
                    <div>
                      <p className="text-xs font-bold uppercase tracking-[0.22em] text-teal-200">Mess</p>
                      <h1 className="text-lg font-black">Khata</h1>
                    </div>
                  </Link>

                  <SidebarNav />

                  <div className="absolute bottom-5 left-5 right-5 rounded-[1.5rem] border border-slate-200 bg-white p-4">
                    <p className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Mode</p>
                    <p className="mt-1 text-sm font-black text-slate-900">Demo Ledger</p>
                  </div>
                </aside>

                <div className="md:pl-72">
                  <header className="sticky top-0 z-40 border-b border-white/70 bg-[#f6f7fb]/80 px-4 py-4 backdrop-blur-2xl md:px-8">
                    <div className="mx-auto flex max-w-6xl items-center justify-between">
                      <Link href="/dashboard" className="md:hidden">
                        <p className="text-[11px] font-black uppercase tracking-[0.2em] text-teal-600">Mess Khata</p>
                        <h1 className="text-lg font-black">Dashboard</h1>
                      </Link>
                      <div className="hidden md:block">
                        <p className="text-[11px] font-black uppercase tracking-[0.24em] text-teal-600">Family ledger</p>
                        <h1 className="text-xl font-black">Dashboard</h1>
                      </div>
                      <div className="rounded-full border border-white bg-white/80 px-4 py-2 text-xs font-black text-slate-700 shadow-sm">
                        May 2026
                      </div>
                    </div>
                  </header>

                  <main className="mx-auto max-w-6xl px-4 py-6 pb-28 md:px-8 md:pb-12">{children}</main>
                </div>

                <BottomNav />
              </div>
            );
          }
          EOF

          cat > src/components/ui/page-heading.tsx <<'EOF'
          export function PageHeading({ eyebrow, title, action }: { eyebrow?: string; title: string; action?: React.ReactNode }) {
            return (
              <section className="mb-6 flex items-end justify-between gap-4">
                <div>
                  {eyebrow ? <p className="text-[11px] font-black uppercase tracking-[0.24em] text-teal-600">{eyebrow}</p> : null}
                  <h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-5xl">{title}</h2>
                </div>
                {action}
              </section>
            );
          }
          EOF

          cat > src/components/ui/metric-card.tsx <<'EOF'
          export function MetricCard({ label, value, helper, tone = "default" }: { label: string; value: string; helper?: string; tone?: "default" | "dark" | "green" | "red" | "blue" }) {
            const styles = {
              default: "border-white bg-white/80 text-slate-950 shadow-slate-200/70",
              dark: "border-slate-900 bg-gradient-to-br from-slate-950 to-slate-800 text-white shadow-slate-300/70",
              green: "border-teal-100 bg-gradient-to-br from-teal-50 to-lime-50 text-teal-950 shadow-teal-100/70",
              red: "border-rose-100 bg-gradient-to-br from-rose-50 to-orange-50 text-rose-950 shadow-rose-100/70",
              blue: "border-indigo-100 bg-gradient-to-br from-indigo-50 to-sky-50 text-indigo-950 shadow-indigo-100/70"
            }[tone];

            return (
              <div className={`rounded-[1.75rem] border p-5 shadow-xl ${styles}`}>
                <p className={`text-xs font-bold uppercase tracking-[0.18em] ${tone === "dark" ? "text-slate-300" : "text-slate-400"}`}>{label}</p>
                <p className="mt-3 text-2xl font-black tracking-tight sm:text-3xl">{value}</p>
                {helper ? <p className={`mt-2 text-xs font-medium ${tone === "dark" ? "text-slate-300" : "text-slate-500"}`}>{helper}</p> : null}
              </div>
            );
          }
          EOF

          cat > src/components/ui/section-card.tsx <<'EOF'
          export function SectionCard({ children, className = "" }: { children: React.ReactNode; className?: string }) {
            return <section className={`rounded-[2rem] border border-white bg-white/80 p-5 shadow-xl shadow-slate-200/60 backdrop-blur md:p-6 ${className}`}>{children}</section>;
          }
          EOF

          cat > src/components/ui/add-button.tsx <<'EOF'
          export function AddButton({ children = "Add" }: { children?: React.ReactNode }) {
            return <button className="rounded-2xl bg-slate-950 px-4 py-3 text-sm font-black text-white shadow-xl shadow-slate-200 transition hover:-translate-y-0.5 hover:bg-teal-600">{children}</button>;
          }
          EOF

          cat > src/app/page.tsx <<'EOF'
          import { redirect } from "next/navigation";

          export default function Home() {
            redirect("/dashboard");
          }
          EOF

          cat > src/app/dashboard/page.tsx <<'EOF'
          import Link from "next/link";
          import { ArrowUpRight } from "lucide-react";
          import { AppShell } from "@/components/layout/app-shell";
          import { MetricCard } from "@/components/ui/metric-card";
          import { PageHeading } from "@/components/ui/page-heading";
          import { SectionCard } from "@/components/ui/section-card";
          import { demoLedger } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function DashboardPage() {
            const totalDue = demoLedger.summaries.filter((row) => row.closingBalance > 0).reduce((sum, row) => sum + row.closingBalance, 0);
            const totalAdvance = demoLedger.summaries.filter((row) => row.closingBalance < 0).reduce((sum, row) => sum + Math.abs(row.closingBalance), 0);

            return (
              <AppShell>
                <PageHeading eyebrow="Overview" title="This month" />

                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                  <MetricCard tone="dark" label="Expense" value={formatTaka(demoLedger.totalExpense)} helper="Total shared" />
                  <MetricCard tone="blue" label="Share" value={formatTaka(demoLedger.monthlyShare)} helper={`${demoLedger.memberCount} members`} />
                  <MetricCard tone="red" label="Due" value={formatTaka(totalDue)} helper="Collectable" />
                  <MetricCard tone="green" label="Advance" value={formatTaka(totalAdvance)} helper="Overpaid" />
                </div>

                <div className="mt-6 grid gap-4 lg:grid-cols-[1.2fr_0.8fr]">
                  <SectionCard className="bg-gradient-to-br from-slate-950 to-slate-800 text-white">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.22em] text-teal-300">Quick action</p>
                        <h3 className="mt-3 text-3xl font-black">Add today’s entry</h3>
                      </div>
                      <ArrowUpRight className="h-6 w-6 text-teal-300" />
                    </div>
                    <div className="mt-6 grid grid-cols-2 gap-3">
                      <Link href="/expenses" className="rounded-2xl bg-white px-4 py-4 text-center text-sm font-black text-slate-950">Expense</Link>
                      <Link href="/payments" className="rounded-2xl bg-teal-300 px-4 py-4 text-center text-sm font-black text-slate-950">Payment</Link>
                    </div>
                  </SectionCard>

                  <SectionCard>
                    <p className="text-xs font-black uppercase tracking-[0.2em] text-slate-400">Formula</p>
                    <h3 className="mt-3 text-2xl font-black">Share - Paid = Due</h3>
                    <p className="mt-3 text-sm font-medium text-slate-500">Previous balance is included automatically.</p>
                  </SectionCard>
                </div>

                <SectionCard className="mt-6">
                  <div className="mb-4 flex items-center justify-between">
                    <h3 className="text-xl font-black">Balances</h3>
                    <Link href="/reports" className="text-sm font-black text-teal-700">Report</Link>
                  </div>
                  <div className="space-y-3">
                    {demoLedger.summaries.map((row) => (
                      <div key={row.member.id} className="flex items-center justify-between gap-3 rounded-3xl bg-slate-50 p-4">
                        <div>
                          <p className="font-black">{row.member.name}</p>
                          <p className="text-xs font-medium text-slate-500">Paid {formatTaka(row.totalContribution)}</p>
                        </div>
                        <div className={`rounded-2xl px-3 py-2 text-right text-sm font-black ${row.closingBalance > 0 ? "bg-rose-100 text-rose-700" : "bg-teal-100 text-teal-700"}`}>
                          {row.closingBalance > 0 ? "Due" : "Advance"}<br />{formatTaka(Math.abs(row.closingBalance))}
                        </div>
                      </div>
                    ))}
                  </div>
                </SectionCard>
              </AppShell>
            );
          }
          EOF

          cat > src/app/members/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { AddButton } from "@/components/ui/add-button";
          import { PageHeading } from "@/components/ui/page-heading";
          import { SectionCard } from "@/components/ui/section-card";
          import { demoMembers } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function MembersPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="People" title="Members" action={<AddButton>Add</AddButton>} />
