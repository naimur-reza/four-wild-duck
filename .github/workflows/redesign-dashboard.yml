name: Redesign Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add mobile dashboard pages
        shell: bash
        run: |
          mkdir -p src/app/dashboard src/app/members src/app/expenses src/app/payments src/app/reports src/app/history src/app/settings
          mkdir -p src/components/layout src/components/ui src/lib/constants

          cat > src/app/globals.css <<'EOF'
          @import "tailwindcss";

          :root {
            --background: #f8fafc;
            --foreground: #0f172a;
          }

          * {
            box-sizing: border-box;
          }

          html {
            scroll-behavior: smooth;
          }

          body {
            margin: 0;
            background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.14), transparent 28rem), #f8fafc;
            color: var(--foreground);
            font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif;
          }

          button,
          input,
          select,
          textarea {
            font: inherit;
          }
          EOF

          cat > src/lib/constants/navigation.ts <<'EOF'
          import { BarChart3, Clock3, CreditCard, Home, ReceiptText, Settings, UsersRound } from "lucide-react";

          export const dashboardNavItems = [
            { label: "Home", href: "/dashboard", icon: Home },
            { label: "Members", href: "/members", icon: UsersRound },
            { label: "Expenses", href: "/expenses", icon: ReceiptText },
            { label: "Payments", href: "/payments", icon: CreditCard },
            { label: "Reports", href: "/reports", icon: BarChart3 },
            { label: "History", href: "/history", icon: Clock3 },
            { label: "Settings", href: "/settings", icon: Settings }
          ];
          EOF

          cat > src/components/layout/bottom-nav.tsx <<'EOF'
          "use client";

          import Link from "next/link";
          import { usePathname } from "next/navigation";
          import { dashboardNavItems } from "@/lib/constants/navigation";

          export function BottomNav() {
            const pathname = usePathname();
            const items = dashboardNavItems.slice(0, 5);

            return (
              <nav className="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/90 px-2 pb-2 pt-2 shadow-[0_-10px_30px_rgba(15,23,42,0.08)] backdrop-blur-xl md:hidden">
                <div className="mx-auto grid max-w-md grid-cols-5 gap-1">
                  {items.map((item) => {
                    const Icon = item.icon;
                    const active = pathname === item.href;

                    return (
                      <Link
                        key={item.href}
                        href={item.href}
                        className={`flex flex-col items-center justify-center rounded-2xl px-2 py-2 text-[11px] font-medium transition ${
                          active ? "bg-slate-950 text-white" : "text-slate-500 hover:bg-slate-100 hover:text-slate-950"
                        }`}
                      >
                        <Icon className="mb-1 h-4 w-4" />
                        {item.label}
                      </Link>
                    );
                  })}
                </div>
              </nav>
            );
          }
          EOF

          cat > src/components/layout/app-shell.tsx <<'EOF'
          import Link from "next/link";
          import { BottomNav } from "@/components/layout/bottom-nav";
          import { dashboardNavItems } from "@/lib/constants/navigation";

          export function AppShell({ children }: { children: React.ReactNode }) {
            return (
              <div className="min-h-screen bg-slate-50 text-slate-950">
                <aside className="fixed inset-y-0 left-0 hidden w-72 border-r border-slate-200 bg-white/80 p-5 backdrop-blur-xl md:block">
                  <Link href="/dashboard" className="flex items-center gap-3 rounded-3xl bg-slate-950 p-4 text-white shadow-xl shadow-slate-200">
                    <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-400 text-lg font-black text-slate-950">M</div>
                    <div>
                      <p className="text-sm text-slate-300">Mess Khata</p>
                      <h1 className="font-semibold">Family Ledger</h1>
                    </div>
                  </Link>

                  <div className="mt-8 space-y-1">
                    {dashboardNavItems.map((item) => {
                      const Icon = item.icon;
                      return (
                        <Link key={item.href} href={item.href} className="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
                          <Icon className="h-4 w-4" />
                          {item.label}
                        </Link>
                      );
                    })}
                  </div>
                </aside>

                <div className="md:pl-72">
                  <header className="sticky top-0 z-40 border-b border-slate-200 bg-slate-50/80 px-4 py-4 backdrop-blur-xl md:px-8">
                    <div className="mx-auto flex max-w-6xl items-center justify-between">
                      <Link href="/dashboard" className="md:hidden">
                        <p className="text-xs font-medium text-emerald-600">Mess Khata</p>
                        <h1 className="text-lg font-bold">Dashboard</h1>
                      </Link>
                      <div className="hidden md:block">
                        <p className="text-xs font-medium uppercase tracking-[0.2em] text-emerald-600">Shared expense tracker</p>
                        <h1 className="text-xl font-bold">Mess Khata Dashboard</h1>
                      </div>
                      <div className="rounded-full bg-white px-3 py-2 text-xs font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200">
                        May 2026
                      </div>
                    </div>
                  </header>

                  <main className="mx-auto max-w-6xl px-4 py-6 pb-28 md:px-8 md:pb-10">{children}</main>
                </div>

                <BottomNav />
              </div>
            );
          }
          EOF

          cat > src/components/ui/page-heading.tsx <<'EOF'
          export function PageHeading({ eyebrow, title, description }: { eyebrow?: string; title: string; description?: string }) {
            return (
              <section className="mb-6">
                {eyebrow ? <p className="text-xs font-bold uppercase tracking-[0.24em] text-emerald-600">{eyebrow}</p> : null}
                <h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-5xl">{title}</h2>
                {description ? <p className="mt-3 max-w-2xl text-sm leading-6 text-slate-600 sm:text-base">{description}</p> : null}
              </section>
            );
          }
          EOF

          cat > src/components/ui/metric-card.tsx <<'EOF'
          export function MetricCard({ label, value, helper, tone = "default" }: { label: string; value: string; helper?: string; tone?: "default" | "dark" | "green" | "red" }) {
            const styles = {
              default: "border-slate-200 bg-white text-slate-950",
              dark: "border-slate-900 bg-slate-950 text-white",
              green: "border-emerald-200 bg-emerald-50 text-emerald-950",
              red: "border-red-200 bg-red-50 text-red-950"
            }[tone];

            return (
              <div className={`rounded-[1.75rem] border p-5 shadow-sm ${styles}`}>
                <p className={`text-sm ${tone === "dark" ? "text-slate-300" : "text-slate-500"}`}>{label}</p>
                <p className="mt-3 text-2xl font-black tracking-tight sm:text-3xl">{value}</p>
                {helper ? <p className={`mt-2 text-xs ${tone === "dark" ? "text-slate-300" : "text-slate-500"}`}>{helper}</p> : null}
              </div>
            );
          }
          EOF

          cat > src/app/page.tsx <<'EOF'
          import { redirect } from "next/navigation";

          export default function Home() {
            redirect("/dashboard");
          }
          EOF

          cat > src/app/dashboard/page.tsx <<'EOF'
          import Link from "next/link";
          import { AppShell } from "@/components/layout/app-shell";
          import { MetricCard } from "@/components/ui/metric-card";
          import { PageHeading } from "@/components/ui/page-heading";
          import { demoLedger } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function DashboardPage() {
            const totalDue = demoLedger.summaries.filter((row) => row.closingBalance > 0).reduce((sum, row) => sum + row.closingBalance, 0);
            const totalAdvance = demoLedger.summaries.filter((row) => row.closingBalance < 0).reduce((sum, row) => sum + Math.abs(row.closingBalance), 0);

            return (
              <AppShell>
                <PageHeading
                  eyebrow="Current month"
                  title="May er hisab ek jaygay."
                  description="Everyone spends freely. Mess Khata splits the full monthly cost, tracks contribution, and carries due forward. No Excel chaos."
                />

                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                  <MetricCard tone="dark" label="Total expense" value={formatTaka(demoLedger.totalExpense)} helper="Rent + bazar + bills" />
                  <MetricCard label="Per person share" value={formatTaka(demoLedger.monthlyShare)} helper={`${demoLedger.memberCount} active members`} />
                  <MetricCard tone="red" label="Total due" value={formatTaka(totalDue)} helper="Need to collect" />
                  <MetricCard tone="green" label="Total advance" value={formatTaka(totalAdvance)} helper="Already overpaid" />
                </div>

                <section className="mt-6 rounded-[2rem] bg-slate-950 p-5 text-white shadow-xl shadow-slate-200 sm:p-7">
                  <div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                      <p className="text-sm font-semibold text-emerald-300">Quick actions</p>
                      <h3 className="mt-2 text-2xl font-black">Add today’s update</h3>
                      <p className="mt-2 text-sm text-slate-300">Start with members, then add expenses and payments.</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2 sm:flex">
                      <Link href="/expenses" className="rounded-2xl bg-white px-4 py-3 text-center text-sm font-bold text-slate-950">Add expense</Link>
                      <Link href="/payments" className="rounded-2xl bg-emerald-400 px-4 py-3 text-center text-sm font-bold text-slate-950">Add payment</Link>
                    </div>
                  </div>
                </section>

                <section className="mt-6 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
                  <div className="flex items-center justify-between gap-4">
                    <div>
                      <h3 className="text-xl font-black">Member balance</h3>
                      <p className="text-sm text-slate-500">Positive means due, negative means advance.</p>
                    </div>
                    <Link href="/reports" className="rounded-full bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700">Full report</Link>
                  </div>

                  <div className="mt-5 space-y-3">
                    {demoLedger.summaries.map((row) => (
                      <div key={row.member.id} className="rounded-3xl border border-slate-100 bg-slate-50 p-4">
                        <div className="flex items-center justify-between gap-3">
                          <div>
                            <p className="font-bold">{row.member.name}</p>
                            <p className="mt-1 text-xs text-slate-500">Paid: {formatTaka(row.totalContribution)} · Share: {formatTaka(row.monthlyShare)}</p>
                          </div>
                          <div className={`rounded-2xl px-3 py-2 text-right text-sm font-black ${row.closingBalance > 0 ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}>
                            {row.closingBalance > 0 ? "Due" : "Advance"}<br />{formatTaka(Math.abs(row.closingBalance))}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </AppShell>
            );
          }
          EOF

          cat > src/app/members/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";
          import { demoMembers } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function MembersPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="People" title="Members" description="Manage who is active in the current month. Inactive members should not be included in monthly split." />
                <div className="grid gap-4 sm:grid-cols-2">
                  {demoMembers.map((member) => (
                    <article key={member.id} className="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
                      <div className="flex items-start justify-between gap-4">
                        <div>
                          <h3 className="text-xl font-black">{member.name}</h3>
                          <p className="mt-1 text-sm text-slate-500">{member.phone ?? "No phone added"}</p>
                        </div>
                        <span className="rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-700">{member.status}</span>
                      </div>
                      <div className="mt-5 rounded-2xl bg-slate-50 p-4">
                        <p className="text-xs text-slate-500">Opening balance</p>
                        <p className="mt-1 text-2xl font-black">{formatTaka(member.openingBalance)}</p>
                      </div>
                    </article>
                  ))}
                </div>
              </AppShell>
            );
          }
          EOF

          cat > src/app/expenses/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";
          import { demoExpenses, demoMembers } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function ExpensesPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="Spendings" title="Expenses" description="Bazar, rent, electricity, internet, gas — every shared cost goes here." />
                <div className="space-y-3">
                  {demoExpenses.map((expense) => {
                    const member = demoMembers.find((item) => item.id === expense.memberId);
                    return (
                      <article key={expense.id} className="rounded-[1.5rem] border border-slate-200 bg-white p-4 shadow-sm">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <p className="text-xs font-bold uppercase tracking-[0.18em] text-emerald-600">{expense.category}</p>
                            <h3 className="mt-1 text-lg font-black">{expense.note}</h3>
                            <p className="mt-1 text-sm text-slate-500">Paid by {member?.name} · {expense.date}</p>
                          </div>
                          <p className="text-lg font-black">{formatTaka(expense.amount)}</p>
                        </div>
                      </article>
                    );
                  })}
                </div>
              </AppShell>
            );
          }
          EOF

          cat > src/app/payments/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";
          import { demoCashPayments, demoMembers } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function PaymentsPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="Cash in" title="Payments" description="Track money given by members. Extra payment will reduce their previous due." />
                <div className="space-y-3">
                  {demoCashPayments.map((payment) => {
                    const member = demoMembers.find((item) => item.id === payment.memberId);
                    return (
                      <article key={payment.id} className="rounded-[1.5rem] border border-slate-200 bg-white p-4 shadow-sm">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <h3 className="text-lg font-black">{member?.name}</h3>
                            <p className="mt-1 text-sm text-slate-500">{payment.note} · {payment.date}</p>
                          </div>
                          <p className="rounded-2xl bg-emerald-100 px-3 py-2 text-lg font-black text-emerald-700">{formatTaka(payment.amount)}</p>
                        </div>
                      </article>
                    );
                  })}
                </div>
              </AppShell>
            );
          }
          EOF

          cat > src/app/reports/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";
          import { demoLedger } from "@/lib/data/demo-ledger";
          import { formatTaka } from "@/lib/utils";

          export default function ReportsPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="Final calculation" title="Monthly report" description="This is the core monthly sheet. Later this page will be frozen when manager closes the month." />
                <div className="space-y-4 md:hidden">
                  {demoLedger.summaries.map((row) => (
                    <article key={row.member.id} className="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
                      <div className="flex items-center justify-between gap-4">
                        <h3 className="text-xl font-black">{row.member.name}</h3>
                        <span className={`rounded-full px-3 py-1 text-xs font-bold ${row.closingBalance > 0 ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}>{row.closingBalance > 0 ? "Due" : "Advance"}</span>
                      </div>
                      <dl className="mt-5 grid grid-cols-2 gap-3 text-sm">
                        <div className="rounded-2xl bg-slate-50 p-3"><dt className="text-slate-500">Previous</dt><dd className="font-black">{formatTaka(row.previousBalance)}</dd></div>
                        <div className="rounded-2xl bg-slate-50 p-3"><dt className="text-slate-500">Share</dt><dd className="font-black">{formatTaka(row.monthlyShare)}</dd></div>
                        <div className="rounded-2xl bg-slate-50 p-3"><dt className="text-slate-500">Spent</dt><dd className="font-black">{formatTaka(row.expensePaid)}</dd></div>
                        <div className="rounded-2xl bg-slate-50 p-3"><dt className="text-slate-500">Cash</dt><dd className="font-black">{formatTaka(row.cashPaid)}</dd></div>
                      </dl>
                      <div className="mt-4 rounded-2xl bg-slate-950 p-4 text-white">
                        <p className="text-xs text-slate-300">Closing balance</p>
                        <p className="mt-1 text-2xl font-black">{formatTaka(Math.abs(row.closingBalance))}</p>
                      </div>
                    </article>
                  ))}
                </div>

                <div className="hidden overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm md:block">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr><th className="p-4">Member</th><th>Previous</th><th>Share</th><th>Spent</th><th>Cash</th><th>Closing</th></tr>
                    </thead>
                    <tbody>
                      {demoLedger.summaries.map((row) => (
                        <tr key={row.member.id} className="border-t border-slate-100">
                          <td className="p-4 font-bold">{row.member.name}</td>
                          <td>{formatTaka(row.previousBalance)}</td>
                          <td>{formatTaka(row.monthlyShare)}</td>
                          <td>{formatTaka(row.expensePaid)}</td>
                          <td>{formatTaka(row.cashPaid)}</td>
                          <td className={row.closingBalance > 0 ? "font-black text-red-600" : "font-black text-emerald-600"}>{row.closingBalance > 0 ? "Due " : "Advance "}{formatTaka(Math.abs(row.closingBalance))}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </AppShell>
            );
          }
          EOF

          cat > src/app/history/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";

          export default function HistoryPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="Previous months" title="History" description="This will show closed month snapshots. The main purpose: never lose old due history again." />
                <div className="rounded-[2rem] border border-dashed border-slate-300 bg-white p-8 text-center shadow-sm">
                  <p className="text-5xl">📒</p>
                  <h3 className="mt-4 text-2xl font-black">No closed month yet</h3>
                  <p className="mt-2 text-sm text-slate-500">Once the manager closes a month, the final report will appear here.</p>
                </div>
              </AppShell>
            );
          }
          EOF

          cat > src/app/settings/page.tsx <<'EOF'
          import { AppShell } from "@/components/layout/app-shell";
          import { PageHeading } from "@/components/ui/page-heading";

          export default function SettingsPage() {
            return (
              <AppShell>
                <PageHeading eyebrow="Control panel" title="Settings" description="Later: mess name, default member count, currency, month close permissions, and Supabase auth." />
                <div className="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm">
                  <p className="text-sm font-bold text-slate-500">Default split</p>
                  <p className="mt-2 text-3xl font-black">4 members</p>
                  <p className="mt-2 text-sm text-slate-500">Current MVP assumes 4 active members. We’ll make this dynamic next.</p>
                </div>
              </AppShell>
            );
          }
          EOF

          rm -f .github/workflows/bootstrap-mess-khata.yml
          rm -f .github/workflows/redesign-dashboard.yml
          rm -f Test

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add mobile dashboard shell and pages" || echo "No changes to commit"
          git push
